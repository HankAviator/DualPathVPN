name: Build Android module

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify LSPosed package metadata
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -q 'assets/xposed_init'
          unzip -l "$apk" | grep -q 'META-INF/xposed/scope.list'
          if unzip -l "$apk" | grep -q 'de/robv/android/xposed'; then
            echo "Xposed API classes must not be packaged in the APK" >&2
            exit 1
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DualPathVPN-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
